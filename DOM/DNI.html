//BETTER SOLUTION THAT SEPERATES DOCUMENT CALLS FROM LOGIC
//function to calculate letter from input
const calculateLetterDni = (dni) => {
  
  if(dni.length !== 8 || isNaN(dni)){
    return ""
  }else{
    //necesary calculation of input number
    const rest = dni % 23;
    //find letter from index
    const letter = "TRWAGMYFPDXBNJZSQVHLCKE".charAt(rest);
    return letter
  }
}

//onclick do the following
document.querySelector("button").addEventListener("click", () => {
  //get input
  const number = document.querySelector("#nie").value
  //get letter by passing function with the parameter of input
  const letter = calculateLetterDni(number);
  //paint into output
  document.querySelector("output").value = letter;
})
</script>
