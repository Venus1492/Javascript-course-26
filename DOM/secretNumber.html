<input type="text" name="" id="number" placeholder="Enter a number">
<br>
<button>Evaluar</button>
<br>
<output></output>


<script>
  const computerNumber = Math.floor(Math.random() * 5) + 1;
  attempts = 0;
  console.log(computerNumber);
  
    const evaluate = () => {
      
      const userNumber = document.querySelector("#number").value;
       
      if (Number(userNumber) === computerNumber) {
         document.querySelector("output").value = `Yoou win!`;
      } else {
        document.querySelector("output").value = `You lose! The number was ${computerNumber}`;
        attempts++
      } if(attempts === 3) {
        document.querySelector("output").value = `You lose! The number was ${computerNumber}. You have reached the maximum number of attempts.`;
      }
    }
  
  document.querySelector("button").addEventListener("click", evaluate);

</script>
