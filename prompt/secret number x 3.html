<script>
  //Almacenar en una constante un número aleatorio, que será el número secreto.
  const numSecret = Math.floor(Math.random() * 100) + 1;
  //Hacer un alert del número aleatorio.
  alert(numSecret);


  let i = 0
  while (i < 3) {
    const user = Number(prompt(`Choose a number`));
    if (user === numSecret) {
      i++;
      alert("Yaay");
      break;
    } else {
      i++;
      alert("nooo");
    }

  };

  //Hacemos un alert de fin del juego
  alert(`End game`)

</script>
