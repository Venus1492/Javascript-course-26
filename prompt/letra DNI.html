<script>
  const userDNI = prompt("Enter DNI sin letra");
  alert(userDNI);

  const getDNILetter = (userDNI) => {
    //convert to string and trim
    const dniStr = userDNI.toString().trim();
    //length equal to 8 & is not not a number
    if (dniStr.length === 8 && !isNaN(dniStr)) {
      const letters = "TRWAGMYFPDXBNJZSQVHLCKE";
      const resto = Number(dniStr) % 23;
      return letters.charAt(resto);
    } else {
      return null;
    }
  };
  console.log(getDNILetter(66666666));
</script>
